<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" width="1000" height="1600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1000" height="1600" fill="#F1F2F3"/>

  <!-- ===== header ===== -->
  <text x="70" y="46" font-size="11" fill="#8A9099" letter-spacing="3.2">MASTER'S THESIS · CABINET 20160387 · 100 CHECKLIST ITEMS</text>
  <text x="70" y="82" font-size="30" font-weight="700" fill="#22262B" letter-spacing="-0.4">Block map — voice inspection agent</text>
  <text x="70" y="106" font-size="14.5" fill="#5A6068">Eleven blocks in build order. Each one answers a single question, so a failure tells you where it lives.</text>

  <!-- ===== DIN rail ===== -->
  <rect x="62" y="150" width="24" height="1360" fill="#B9BDC2"/>
  <rect x="62" y="150" width="24" height="1360" fill="none" stroke="#9AA0A6" stroke-width="1"/>
  <rect x="68" y="150" width="12" height="1360" fill="#A8ADB3"/>
  <g fill="#8E949A">
    <rect x="68" y="168" width="12" height="7"/><rect x="68" y="198" width="12" height="7"/><rect x="68" y="228" width="12" height="7"/>
    <rect x="68" y="258" width="12" height="7"/><rect x="68" y="288" width="12" height="7"/><rect x="68" y="318" width="12" height="7"/>
    <rect x="68" y="348" width="12" height="7"/><rect x="68" y="378" width="12" height="7"/><rect x="68" y="408" width="12" height="7"/>
    <rect x="68" y="438" width="12" height="7"/><rect x="68" y="468" width="12" height="7"/><rect x="68" y="498" width="12" height="7"/>
    <rect x="68" y="528" width="12" height="7"/><rect x="68" y="558" width="12" height="7"/><rect x="68" y="588" width="12" height="7"/>
    <rect x="68" y="618" width="12" height="7"/><rect x="68" y="648" width="12" height="7"/><rect x="68" y="678" width="12" height="7"/>
    <rect x="68" y="708" width="12" height="7"/><rect x="68" y="738" width="12" height="7"/><rect x="68" y="768" width="12" height="7"/>
    <rect x="68" y="798" width="12" height="7"/><rect x="68" y="828" width="12" height="7"/><rect x="68" y="858" width="12" height="7"/>
    <rect x="68" y="888" width="12" height="7"/><rect x="68" y="918" width="12" height="7"/><rect x="68" y="948" width="12" height="7"/>
    <rect x="68" y="978" width="12" height="7"/><rect x="68" y="1008" width="12" height="7"/><rect x="68" y="1038" width="12" height="7"/>
    <rect x="68" y="1068" width="12" height="7"/><rect x="68" y="1098" width="12" height="7"/><rect x="68" y="1128" width="12" height="7"/>
    <rect x="68" y="1158" width="12" height="7"/><rect x="68" y="1188" width="12" height="7"/><rect x="68" y="1218" width="12" height="7"/>
    <rect x="68" y="1248" width="12" height="7"/><rect x="68" y="1278" width="12" height="7"/><rect x="68" y="1308" width="12" height="7"/>
    <rect x="68" y="1338" width="12" height="7"/><rect x="68" y="1368" width="12" height="7"/><rect x="68" y="1398" width="12" height="7"/>
    <rect x="68" y="1428" width="12" height="7"/><rect x="68" y="1458" width="12" height="7"/><rect x="68" y="1488" width="12" height="7"/>
  </g>

  <!-- ============ GROUP A ============ -->
  <text x="96" y="138" font-size="10.5" fill="#8A9099" letter-spacing="2.6">SET THE FACTS</text>
  <line x1="96" y1="146" x2="944" y2="146" stroke="#D2D5D8" stroke-width="1"/>

  <g>
    <rect x="96" y="160" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="160" width="9" height="96" fill="#8A9099"/>
    <rect x="122" y="192" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="214" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">0</text>
    <text x="186" y="196" font-size="16" font-weight="700" fill="#22262B">Fix CONTEXT.md — write down 220 parts, not 60.</text>
    <text x="186" y="219" font-size="13.5" fill="#5A6068">Checklist size, the advisor session and the time budget were all sized off the wrong number.</text>
    <text x="186" y="240" font-size="12.5" fill="#8A9099">DONE WHEN · the file no longer contradicts the design.</text>
    <rect x="898" y="196" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <!-- ============ GROUP B ============ -->
  <text x="96" y="284" font-size="10.5" fill="#8A9099" letter-spacing="2.6">KNOW YOUR DATA — NO MICROPHONE NEEDED</text>
  <line x1="96" y1="292" x2="944" y2="292" stroke="#D2D5D8" stroke-width="1"/>

  <g>
    <rect x="96" y="306" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="306" width="9" height="96" fill="#2E6FB7"/>
    <rect x="122" y="338" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="360" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">1</text>
    <text x="186" y="342" font-size="16" font-weight="700" fill="#22262B">Loader — read schematic.json, drop filler and duplicate wrappers.</text>
    <text x="186" y="365" font-size="13.5" fill="#5A6068">You cannot check parts until you know which parts are really in the cabinet.</text>
    <text x="186" y="386" font-size="12.5" fill="#8A9099">DONE WHEN · you get exactly 173 core parts and 37 distinct part numbers.</text>
    <rect x="898" y="342" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="96" y="416" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="416" width="9" height="96" fill="#2E6FB7"/>
    <rect x="122" y="448" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="470" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">2</text>
    <text x="186" y="452" font-size="16" font-weight="700" fill="#22262B">Position — turn x/y coordinates into “Rail AB, position 4”.</text>
    <text x="186" y="475" font-size="13.5" fill="#5A6068">The export has no rail or position field, and location is the only thing the trainee is told.</text>
    <text x="186" y="496" font-size="12.5" fill="#8A9099">DONE WHEN · the walking order matches the real cabinet by eye.</text>
    <rect x="898" y="452" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="96" y="526" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="526" width="9" height="96" fill="#2E6FB7"/>
    <rect x="122" y="558" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="580" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">3</text>
    <text x="186" y="562" font-size="16" font-weight="700" fill="#22262B">Checklist and priority bands — 92 devices plus 8 terminal strips.</text>
    <text x="186" y="585" font-size="13.5" fill="#5A6068">Priority-first is the point. Ranking 29 types with your advisor beats ranking 100 components.</text>
    <text x="186" y="606" font-size="12.5" fill="#8A9099">DONE WHEN · all 100 items carry a band.</text>
    <rect x="898" y="562" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <!-- ============ GROUP C ============ -->
  <text x="96" y="650" font-size="10.5" fill="#8A9099" letter-spacing="2.6">TEST WHAT COULD KILL IT</text>
  <line x1="96" y1="658" x2="944" y2="658" stroke="#D2D5D8" stroke-width="1"/>

  <g>
    <rect x="96" y="672" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="672" width="9" height="96" fill="#E8721C"/>
    <rect x="122" y="704" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="726" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">4</text>
    <text x="186" y="708" font-size="16" font-weight="700" fill="#22262B">Normaliser — “a nine f zero three one one six” becomes A9F03116.</text>
    <text x="186" y="731" font-size="13.5" fill="#5A6068">Speech-to-text writes prose, not catalogue numbers. Plain rules here, no model.</text>
    <text x="186" y="752" font-size="12.5" fill="#8A9099">DONE WHEN · it survives 20 real recorded reads.</text>
    <rect x="898" y="708" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <!-- block 5 — the gate -->
  <g>
    <rect x="96" y="782" width="848" height="96" fill="#FFFFFF" stroke="#E8721C" stroke-width="2"/>
    <rect x="96" y="782" width="9" height="96" fill="#E8721C"/>
    <rect x="122" y="814" width="44" height="32" fill="#FDF0E5" stroke="#E8721C" stroke-width="1.5"/>
    <text x="144" y="836" font-size="17" font-weight="700" fill="#B4530D" text-anchor="middle">5</text>
    <text x="186" y="818" font-size="16" font-weight="700" fill="#22262B">ASR reality check — record 30 real labels standing at the cabinet.</text>
    <text x="186" y="841" font-size="13.5" fill="#5A6068">Nobody has ever measured this. If speech cannot hear A9F03116, the whole method fails.</text>
    <text x="186" y="862" font-size="12.5" fill="#B4530D" font-weight="700">DONE WHEN · you have an error rate on paper.</text>
    <rect x="782" y="800" width="140" height="30" fill="#F2C400" stroke="#C9A200" stroke-width="1"/>
    <text x="852" y="820" font-size="12.5" font-weight="700" fill="#22262B" text-anchor="middle" letter-spacing="1.6">START HERE</text>
    <rect x="898" y="843" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <!-- ============ GROUP D ============ -->
  <text x="96" y="906" font-size="10.5" fill="#8A9099" letter-spacing="2.6">BUILD THE JUDGEMENT</text>
  <line x1="96" y1="914" x2="944" y2="914" stroke="#D2D5D8" stroke-width="1"/>

  <g>
    <rect x="96" y="928" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="928" width="9" height="96" fill="#3F8F4A"/>
    <rect x="122" y="960" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="982" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">6</text>
    <text x="186" y="964" font-size="16" font-weight="700" fill="#22262B">Adjudicator — match, mismatch, not-in-schematic, or ask again.</text>
    <text x="186" y="987" font-size="13.5" fill="#5A6068">This is where a wrong part gets caught. Test it with typed text, no microphone.</text>
    <text x="186" y="1008" font-size="12.5" fill="#8A9099">DONE WHEN · every one of the four outcomes is reachable by a test.</text>
    <rect x="898" y="964" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="96" y="1038" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="1038" width="9" height="96" fill="#3F8F4A"/>
    <rect x="122" y="1070" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="1092" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">7</text>
    <text x="186" y="1074" font-size="16" font-weight="700" fill="#22262B">Session runner — prompt, commit, judge, then reveal.</text>
    <text x="186" y="1097" font-size="13.5" fill="#5A6068">Silent re-asks and no hints are what stop the trainee guessing the answer you fed them.</text>
    <text x="186" y="1118" font-size="12.5" fill="#8A9099">DONE WHEN · you complete one full 100-item run without stopping.</text>
    <rect x="898" y="1074" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="96" y="1148" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="1148" width="9" height="96" fill="#3F8F4A"/>
    <rect x="122" y="1180" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="1202" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">8</text>
    <text x="186" y="1184" font-size="16" font-weight="700" fill="#22262B">Flags and report — append-only, audio kept, all 100 items saved.</text>
    <text x="186" y="1207" font-size="13.5" fill="#5A6068">A qualified human reviews every flag. The matches are what give you a false-flag rate.</text>
    <text x="186" y="1228" font-size="12.5" fill="#8A9099">DONE WHEN · a reviewer could act on the file without asking you anything.</text>
    <rect x="898" y="1184" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <!-- ============ GROUP E ============ -->
  <text x="96" y="1272" font-size="10.5" fill="#8A9099" letter-spacing="2.6">PROVE IT</text>
  <line x1="96" y1="1280" x2="944" y2="1280" stroke="#D2D5D8" stroke-width="1"/>

  <g>
    <rect x="96" y="1294" width="848" height="96" fill="#FFFFFF" stroke="#D2D5D8" stroke-width="1"/>
    <rect x="96" y="1294" width="9" height="96" fill="#B08900"/>
    <rect x="122" y="1326" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="1348" font-size="17" font-weight="700" fill="#22262B" text-anchor="middle">9</text>
    <text x="186" y="1330" font-size="16" font-weight="700" fill="#22262B">Evaluation — plant faults, run the cabinet, count what was caught.</text>
    <text x="186" y="1353" font-size="13.5" fill="#5A6068">This is the thesis chapter. You plant and run alone, so write that down as a limitation.</text>
    <text x="186" y="1374" font-size="12.5" fill="#8A9099">DONE WHEN · the numbers exist and the unblinding limit is written up.</text>
    <rect x="898" y="1330" width="24" height="24" fill="none" stroke="#B9BDC2" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="96" y="1404" width="848" height="96" fill="#FAFAF9" stroke="#C6CACE" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="96" y="1404" width="9" height="96" fill="#B9BDC2"/>
    <rect x="122" y="1436" width="44" height="32" fill="#FBFBFA" stroke="#B9BDC2" stroke-width="1"/>
    <text x="144" y="1458" font-size="17" font-weight="700" fill="#8A9099" text-anchor="middle">10</text>
    <text x="186" y="1440" font-size="16" font-weight="700" fill="#5A6068">Redlines — send confirmed mismatches back to the schematic.</text>
    <text x="186" y="1463" font-size="13.5" fill="#8A9099">Nice to have, not load-bearing.</text>
    <text x="186" y="1484" font-size="12.5" fill="#8A9099">CUT THIS FIRST · if the month runs short.</text>
    <rect x="898" y="1440" width="24" height="24" fill="none" stroke="#C6CACE" stroke-width="1.5"/>
  </g>

  <!-- ===== footer ===== -->
  <line x1="96" y1="1532" x2="944" y2="1532" stroke="#D2D5D8" stroke-width="1"/>
  <text x="96" y="1556" font-size="13" fill="#5A6068">Rule · do not start a block until the one before it holds.</text>
  <text x="96" y="1577" font-size="13" fill="#8A9099">Blocks 0, 3, 5 and 9 produce no code at all — they are a document, a meeting, a measurement and an experiment.</text>

</svg>
