[project]
name = "redlining"
version = "0.1.0"
description = "Voice-guided inspection assistant for one control cabinet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "openai>=3.5.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redlining"]